<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Offline expense tracker: bank statement analyser, subscription tracker and tax helper. Your data never leaves your device.">
<title>Paisa Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app" id="app">
  <aside class="sidebar" aria-label="Sidebar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="34" height="34"><div>Paisa Ledger<small>Private · Offline</small></div></div>
    <nav class="main" id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <div class="privacy-pill" title="No data leaves this device"><span id="pillIcon"></span><span class="lbl">Offline &amp; private</span></div>
      <button class="side-btn" id="profileBtn" title="Switch profile"></button>
      <button class="side-btn" id="lockBtn" title="Lock app (Ctrl+L)"></button>
      <button class="side-btn" id="themeBtn" title="Toggle theme"></button>
      <button class="side-btn" id="collapseBtn" title="Collapse sidebar"></button>
    </div>
  </aside>
  <div class="col">
    <header class="topbar" id="topbar">
      <div class="title" id="pageTitle">Home</div>
      <div class="spacer"></div>
      <button class="search-btn" id="searchBtn" aria-label="Search and commands"><span id="searchIcon"></span><span class="slbl">Search or jump to…</span><kbd>Ctrl K</kbd></button>
      <button class="icon-btn" id="bellBtn" aria-label="Alerts"></button>
    </header>
    <main id="view" tabindex="-1" aria-live="polite"><div class="card"><div class="skeleton" style="height:120px"></div></div></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main (mobile)"></nav>
<button class="fab" id="fab" data-action="add-txn" aria-label="Add expense"></button>
<div id="palette" class="palette" hidden><div class="palette-box" role="dialog" aria-label="Command palette"><input id="paletteInput" placeholder="Search transactions, jump to a page, run a command…" autocomplete="off" aria-label="Search"><div class="palette-list" id="paletteList"></div><div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div></div>
<div id="lock" class="lockscreen" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="padding:2rem">Paisa Ledger needs JavaScript. It works fully offline.</p></noscript>
<script src="vendor/pdf.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
