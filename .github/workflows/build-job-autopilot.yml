name: Build Job Autopilot

# Builds the Job Autopilot desktop app (Windows installer + portable .exe).
# Run it from the Actions tab ("Run workflow"); it also runs on every push that touches job-autopilot/.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths: ['job-autopilot/**', '.github/workflows/build-job-autopilot.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: job-autopilot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: job-autopilot/package-lock.json }
      - run: npm ci
      - name: Install a browser for the form-filling tests
        run: npx playwright-core install --with-deps chromium
      - run: npm test
      - name: End-to-end test of the real desktop app (mock job sites)
        run: xvfb-run -a node tests/electron.e2e.mjs

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults: { run: { working-directory: job-autopilot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: job-autopilot/package-lock.json }
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned build
      - uses: actions/upload-artifact@v4
        with:
          name: JobAutopilot-windows
          path: job-autopilot/dist/*.exe
          if-no-files-found: error
