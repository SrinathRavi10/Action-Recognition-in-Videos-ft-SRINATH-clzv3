<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Job Autopilot</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app is-desktop" id="app">
  <aside class="sidebar">
    <div class="brand"><img src="logo.svg" alt="" width="34" height="34"><div>Job Autopilot<small>Resume-driven</small></div></div>
    <nav class="main" id="nav" aria-label="Main"></nav>
    <div class="side-foot"><div class="privacy-pill" id="pill"></div><button class="side-btn" id="themeBtn"></button></div>
  </aside>
  <div class="col">
    <header class="topbar" id="topbar"><div class="title" id="pageTitle">Today</div><div class="spacer"></div><div id="topStatus" class="muted small"></div><button class="search-btn" id="searchBtn" aria-label="Search or jump to"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="slbl">Jump to…</span><kbd>Ctrl K</kbd></button></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="palette" id="palette" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
